name: Pokemon checkpoint tests

on:
  push:
    branches: [main]
    paths: ['getall.py', 'collection_lock.py', '*.bat', 'tests/**', 'requirements.txt', '.github/workflows/pokemon-tests.yml']
  pull_request:
    paths: ['getall.py', 'collection_lock.py', '*.bat', 'tests/**', 'requirements.txt', '.github/workflows/pokemon-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pokemon-checkpoints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoints:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
